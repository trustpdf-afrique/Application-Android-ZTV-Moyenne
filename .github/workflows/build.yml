name: Construire ZTV Moyenne

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Décompresser le projet
        run: |
          unzip -q ZTV_Moyenne_Android.zip
          cd ZTV_Moyenne_Android
          echo "Projet décompressé"

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Construire l'APK
        run: |
          cd ZTV_Moyenne_Android
          gradle :app:assembleDebug --no-daemon

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ZTV-Moyenne-APK
          path: ZTV_Moyenne_Android/app/build/outputs/apk/debug/app-debug.apk
